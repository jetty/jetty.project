#
# This file defines users, passwords and roles for the HashLoginService.
#
# Each line has the format:
#
#   <username>: <password>[,<rolename>...]
#
# The password may be in plain text, or obfuscated, MD5 or crypt encoded.
# Use the org.eclipse.jetty.util.security.Password utility to generate the
# obfuscated/MD5/crypt forms, for example:
#
#   java -cp lib/jetty-util-<version>.jar org.eclipse.jetty.util.security.Password myuser mypassword
#
# Then use the generated value, for example (the value below is "password"):
#
#   myuser: OBF:1v2j1uum1xtv1zej1zer1xtn1uvk1v1v,read
#
# Example users (CHANGE THESE - DO NOT USE IN PRODUCTION):
#
# admin: password,read,write
# user: password,read
